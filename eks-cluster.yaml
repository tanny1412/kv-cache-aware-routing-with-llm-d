apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: llm-d-bench
  region: us-east-1
  version: "1.31"

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  - name: gpu-workers
    instanceType: g6.xlarge
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 100
    labels:
      workload: llm-d-gpu
    tags:
      project: llm-d-benchmark
